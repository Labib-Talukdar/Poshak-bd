<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reloop Admin</title>
<style>:root{--ink:#16202f;--green:#0e6b50;--line:#dfe5e1;--bg:#f4f7f5}*{box-sizing:border-box}body{font:15px/1.5 Inter,system-ui,sans-serif;margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}.hidden{display:none!important}.shell{max-width:1180px;margin:auto;padding:28px 20px}.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.topbar h1{margin:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.stat small{display:block;color:#718077}.stat strong{font-size:26px}.panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:18px}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input{flex:1}.toolbar input,.toolbar select,.panel input,.panel select{padding:10px;border:1px solid var(--line);border-radius:8px;background:white}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th{text-align:left;font-size:12px;color:#718077;text-transform:uppercase}td,th{padding:12px 10px;border-bottom:1px solid var(--line);white-space:nowrap}.thumb{width:48px;height:58px;object-fit:cover;border-radius:6px;background:#edf0ed}.id{font-family:monospace;color:#718077}.actions{display:flex;gap:7px}.actions button,.primary,.danger{border:0;border-radius:7px;padding:8px 11px;color:white;background:var(--green);cursor:pointer}.danger{background:#b84646}.login{max-width:420px;margin:80px auto;border:1px solid var(--line);border-radius:12px;padding:24px;background:white}.login input{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px}.login button{width:100%;margin-top:10px;padding:11px}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.form-grid label{font-size:12px;color:#718077}.form-grid input{width:100%;margin-top:4px}.orders{display:grid;gap:10px}.order{border:1px solid var(--line);border-radius:9px;padding:14px}.order-head{display:flex;justify-content:space-between}.modal-backdrop{position:fixed;inset:0;background:#16202f70;display:grid;place-items:center;padding:20px}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:white;border-radius:14px;padding:20px}.modal-head{display:flex;justify-content:space-between;align-items:center}.modal-head button{border:0;background:none;font-size:22px}.edit-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.edit-grid label{font-size:12px;color:#718077}.edit-grid input,.edit-grid select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;margin-top:4px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}@media(max-width:700px){.stats{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr 1fr}.edit-grid{grid-template-columns:1fr}.toolbar{flex-direction:column}.shell{padding:20px 12px}}</style></head><body>
<div class="login" id="loginPanel"><h2>Reloop Admin</h2><input id="emailInput" type="email" placeholder="Admin email" autocomplete="username"><input id="passwordInput" type="password" placeholder="Admin password" autocomplete="current-password" style="margin-top:10px"><button id="loginButton" type="button">Login</button></div>
<div id="adminContent" class="shell hidden"><div class="topbar"><h1>Store management</h1><button class="danger" onclick="logout()">Logout</button></div>
<div class="stats"><div class="stat"><small>Total products</small><strong id="productCount">0</strong></div><div class="stat"><small>Total stock</small><strong id="stockCount">0</strong></div><div class="stat"><small>Total orders</small><strong id="orderCount">0</strong></div></div>
<div class="panel"><h2>Add product</h2><form id="pf" enctype="multipart/form-data"><div class="form-grid"><label>Name<input name="name" required placeholder="Product name"></label><label>Price (৳)<input name="price" type="number" min="0" required></label><label>Category<input name="category" required placeholder="Men / Women / Kids"></label><label>Sizes<input name="sizes" required placeholder="S,M,L,XL"></label><label>Stock<input name="stock" type="number" min="0" required></label><label>Image URL<input name="image" placeholder="https://..."></label><label>Upload image<input name="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label></div><button class="primary" style="margin-top:12px">Add product</button></form></div>
<div class="panel"><div class="toolbar"><input id="productSearch" placeholder="Search by ID, name, category or size"><select id="stockFilter"><option value="all">All stock</option><option value="in">In stock</option><option value="out">Out of stock</option><option value="low">Low stock (≤5)</option></select></div><div class="table-wrap"><table><thead><tr><th>ID</th><th>Image</th><th>Product</th><th>Category</th><th>Sizes</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead><tbody id="pl"></tbody></table></div></div>
<div class="panel"><h2>Orders</h2><div id="ol" class="orders"></div></div></div>
<div id="editBackdrop" class="modal-backdrop hidden"><div class="modal"><div class="modal-head"><h2>Edit product <span id="editId"></span></h2><button onclick="closeEdit()">×</button></div><form id="editForm" enctype="multipart/form-data"><div class="edit-grid"><label>Product ID<input id="editProductId" readonly></label><label>Name<input name="name" required></label><label>Price (৳)<input name="price" type="number" min="0" required></label><label>Category<input name="category" required></label><label>Sizes<input name="sizes" required></label><label>Stock<input name="stock" type="number" min="0" required></label><label>Image URL<input name="image" placeholder="Leave empty or upload"><input type="hidden" name="existingImage"></label><label>Replace image<input name="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label></div><div class="modal-actions"><button type="button" class="danger" onclick="closeEdit()">Cancel</button><button class="primary" type="submit">Save changes</button></div></form></div></div>
<script>
let products=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
async function api(m,u,b){const multipart=b instanceof FormData;const r=await fetch('/api/admin/'+u,{method:m,credentials:'same-origin',headers:{...(!multipart&&{'Content-Type':'application/json'})},body:b?(multipart?b:JSON.stringify(b)):undefined});if(r.status===401){loginPanel.classList.remove('hidden');adminContent.classList.add('hidden');throw new Error('Admin session required')}return r.json()}
function matchesFilters(x){const raw=productSearch.value.trim().toLowerCase();const q=raw.replace(/^#/,'');const hay=['#'+x.id,x.id,x.name,x.category,x.sizes,x.price,x.stock].join(' ').toLowerCase();if(q){if(/^\d+$/.test(q)&&String(x.id)!==q)return false;if(!/^\d+$/.test(q)&&!hay.includes(q))return false}const f=stockFilter.value;if(f==='in'&&x.stock<=0)return false;if(f==='out'&&x.stock!==0)return false;if(f==='low'&&(x.stock<=0||x.stock>5))return false;return true}
function renderProducts(){const visible=products.filter(matchesFilters);pl.innerHTML=visible.map(x=>`<tr><td class="id">#${x.id}</td><td>${x.image?`<img class="thumb" src="${esc(x.image)}" alt="">`:'—'}</td><td><b>${esc(x.name)}</b></td><td>${esc(x.category)}</td><td>${esc(x.sizes||'—')}</td><td>৳${Number(x.price).toLocaleString()}</td><td>${x.stock}</td><td><div class="actions"><button onclick="openEdit(${x.id})">Edit</button><button class="danger" onclick="del(${x.id})">Remove</button></div></td></tr>`).join('')||'<tr><td colspan="8">No products match your search.</td></tr>';productCount.textContent=products.length;stockCount.textContent=products.reduce((n,x)=>n+Number(x.stock||0),0)}
async function load(){products=await api('GET','products');renderProducts();const o=await api('GET','orders');orderCount.textContent=o.length;ol.innerHTML=o.map(x=>{let items=[];try{items=typeof x.items==='string'?JSON.parse(x.items||'[]'):x.items}catch(e){}return `<div class="order"><div class="order-head"><b>${esc(x.order_number||'#'+x.id)} · ${esc(x.name)}</b><select onchange="api('PATCH','orders/${x.id}',{status:this.value}).then(()=>load())">${['new','confirmed','shipped','delivered','cancelled'].map(s=>`<option ${s==x.status?'selected':''}>${s}</option>`).join('')}</select></div><p>${esc(x.phone)} · ${esc(x.district)}<br>${esc(x.address)}</p><div class="order-items">${items.map(i=>`<div><span>${esc(i.name)}${i.size?' · Size '+esc(i.size):''} × ${i.qty}</span><b>৳${Number(i.lineTotal||i.price*i.qty).toLocaleString()}</b></div>`).join('')}</div><b>Total ৳${Number(x.total).toLocaleString()}</b></div>`}).join('')||'<p>No orders yet.</p>'}
function openEdit(id){const x=products.find(p=>p.id===id);if(!x)return;editId.textContent='#'+x.id;editProductId.value=x.id;const f=editForm.elements;f.name.value=x.name;f.price.value=x.price;f.category.value=x.category||'';f.sizes.value=x.sizes||'';f.stock.value=x.stock||0;f.image.value=x.image||'';f.existingImage.value=x.image||'';editBackdrop.classList.remove('hidden')}
function closeEdit(){editBackdrop.classList.add('hidden')}
async function del(id){if(!confirm('Remove product #'+id+'?'))return;await api('DELETE','products/'+id);await load()}
pf.onsubmit=async e=>{e.preventDefault();await api('POST','products',new FormData(pf));pf.reset();await load()};
editForm.onsubmit=async e=>{e.preventDefault();const id=editProductId.value;await api('PATCH','products/'+id,new FormData(editForm));closeEdit();await load()};
productSearch.oninput=renderProducts;stockFilter.onchange=renderProducts;
loginButton.onclick=async()=>{try{const r=await fetch('/api/admin/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:emailInput.value,password:passwordInput.value})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Login failed');await load();loginPanel.classList.add('hidden');adminContent.classList.remove('hidden')}catch(e){loginButton.textContent=e.message||'Login failed — try again'}};
async function logout(){await fetch('/api/admin/auth/logout',{method:'POST',credentials:'same-origin'});location.reload()}
fetch('/api/admin/auth/me',{credentials:'same-origin'}).then(r=>r.ok?load().then(()=>{loginPanel.classList.add('hidden');adminContent.classList.remove('hidden')}):null).catch(()=>{})
</script></body></html>
